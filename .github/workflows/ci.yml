name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-test:
    name: Scanner self-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate repository structure (plugin + marketplace + installer)
        run: python3 tests/validate_structure.py

      - name: Run the scanner self-test
        run: python3 tests/run_tests.py

      - name: Verify the direct installer works
        run: |
          python3 install.py --dest "$RUNNER_TEMP/claude-test"
          python3 install.py --dest "$RUNNER_TEMP/claude-test" --check
          python3 install.py --dest "$RUNNER_TEMP/claude-test" --uninstall
      - name: Check the rule catalog is not stale
        run: python3 skills/store-compliance/scripts/oneshot.py verify-deadlines
        continue-on-error: true

  lint:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m compileall -q skills/store-compliance/scripts tests
